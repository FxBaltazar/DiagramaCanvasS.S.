<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama Canvas - Solar System</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-canvas: #ffffff;
            --border-color: #cbd5e1;
            --text-dark: #1e293b;
            --text-light: #ffffff;
            --accent: #2563eb;
            --accent-bg: #eff6ff;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.2rem;
            margin: 0;
            color: #38bdf8;
        }

        header h2 {
            font-size: 1.4rem;
            font-weight: 400;
            margin: 5px 0 0 0;
            color: #94a3b8;
        }

        /* Rejilla fija de 5 columnas alineada con tu última imagen */
        .canvas-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-auto-rows: minmax(130px, auto);
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            background: var(--bg-canvas);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Estilo base para cada recuadro */
        .box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            color: var(--text-dark);
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .box:hover {
            background: var(--accent-bg);
            border-color: var(--accent);
            transform: scale(1.02);
        }

        /* Modificadores de posición basados en la captura */
        .double-row {
            grid-row: span 2;
        }

        .propuesta-box {
            grid-row: span 2;
            border: 2px solid var(--accent);
            background: var(--accent-bg);
        }

        .wide-3 {
            grid-column: span 3;
        }

        .wide-2 {
            grid-column: span 2;
        }

        /* Estilos de la Ventana Emergente (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-box {
            background: #ffffff;
            color: var(--text-dark);
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 480px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-box h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.3rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .modal-box ul {
            padding-left: 20px;
            line-height: 1.5;
        }

        .modal-box li {
            margin-bottom: 8px;
        }

        .close-x {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #94a3b8;
            cursor: pointer;
            border: none;
            background: none;
        }

        .close-x:hover {
            color: #ef4444;
        }

        @media (max-width: 900px) {
            .canvas-grid { display: flex; flex-direction: column; }
            .box { min-height: 90px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Diagrama Canvas</h1>
        <h2>(Solar System)</h2>
    </header>

    <div class="canvas-grid">
        <!-- Fila 1 -->
        <div class="box" onclick="openModal('problemas')">1. Problemas</div>
        <div class="box" onclick="openModal('alternativas')">1b. Alternativas</div>
        <div class="box propuesta-box" onclick="openModal('propuesta')">3. Propuesta de Valor</div>
        <div class="box" onclick="openModal('solucion')">4. Solución</div>
        <div class="box" onclick="openModal('metricas')">8. Métricas</div>

        <!-- Fila 2 -->
        <div class="box" onclick="openModal('ventajas')">9. Ventajas Competitivas</div>
        <div class="box" onclick="openModal('canales')">5. Canales</div>
        <!-- El bloque 3 ocupa este espacio central por su altura -->
        <div class="box double-row" onclick="openModal('segmento')">2. Segmento de Clientes</div>
        <!-- El espacio bajo solución/métricas se distribuye según la altura del segmento -->

        <!-- Fila 3 e Inferior -->
        <div class="box wide-2" onclick="openModal('costos')">7. Estructura de Costos</div>
        <!-- Espacio vacío gestionado automáticamente por la rejilla -->
        <div class="box wide-3" style="grid-column: 1 / 4;" onclick="openModal('ingresos')">6. Flujo de Ingresos</div>
    </div>

    <!-- Ventana Emergente -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeOnOutside(event)">
        <div class="modal-box">
            <button class="close-x" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle">Título</h3>
            <div id="modalBody">Contenido</div>
        </div>
    </div>

    <script>
        const canvasData = {
            problemas: {
                title: "1. Problemas",
                content: "<ul><li>Precios muy altos en las tiendas de La Paz debido a que el producto pasa por muchos revendedores.</li><li>Poco stock de piezas modernas: Las tiendas locales suelen tardar meses en traer lo último del mercado.</li><li>Malas garantías: Muchas tiendas informales no quieren hacerse cargo de fallas o tardan demasiado.</li></ul>"
            },
            alternativas: {
                title: "1b. Alternativas",
                content: "<ul><li>Comprar en las tiendas tradicionales de la Eloy Salmón o centros comerciales tecnológicos.</li><li>Pedir el producto por internet a páginas de afuera (asumiendo largas esperas y riesgos de pérdida).</li></ul>"
            },
            solucion: {
                title: "4. Solución",
                content: "<ul><li>Importación directa: Comprar directamente a distribuidores grandes del exterior para vender más barato en La Paz.</li><li>Pedidos personalizados: Si un cliente busca una pieza muy específica que no hay en el país, se la traemos por encargo.</li></ul>"
            },
            metricas: {
                title: "8. Métricas",
                content: "<ul><li>Número de clientes nuevos que nos compran cada mes.</li><li>Cantidad de personas que nos recomiendan con sus conocidos tras su compra.</li></ul>"
            },
            propuesta: {
                title: "3. Propuesta de Valor",
                content: "<p><strong>'Traemos la mejor tecnología para tu computadora directo del extranjero, al precio más justo de La Paz y con garantía real'.</strong></p>"
            },
            ventajas: {
                title: "9. Ventajas Competitivas",
                content: "<ul><li>Rapidez y confianza: Traemos los productos en tiempo récord y ofrecemos un servicio técnico propio que soluciona cualquier falla de fábrica de inmediato, sin intermediarios.</li></ul>"
            },
            canales: {
                title: "5. Canales",
                content: "<ul><li>Venta por redes sociales (videos demostrativos en TikTok y Facebook Marketplace).</li><li>Atención y catálogo rápido a través de WhatsApp.</li><li>Entregas en puntos céntricos y seguros de la ciudad (o envíos a domicilio).</li></ul>"
            },
            segmento: {
                title: "2. Segmento de Clientes",
                content: "<ul><li>Jóvenes gamers que quieren armar o mejorar sus computadoras para jugar.</li><li>Diseñadores, editores de video y programadores que necesitan equipos potentes para trabajar rápido.</li></ul>"
            },
            costos: {
                title: "7. Estructura de Costos",
                content: "<ul><li>Dinero para comprar la mercadería afuera y pagar el transporte internacional.</li><li>Pago de los impuestos obligatorios en la Aduana de Bolivia.</li><li>Gastos en publicidad por internet para que más gente en La Paz conozca el negocio.</li></ul>"
            },
            ingresos: {
                title: "6. Flujo de Ingresos",
                content: "<ul><li>Ganancia por la venta de las piezas de hardware (tarjetas de video, procesadores, memorias, etc.).</li><li>Cobro por el servicio de armado, limpieza y optimización de las computadoras.</li></ul>"
            }
        };

        const overlay = document.getElementById('modalOverlay');
        const mTitle = document.getElementById('modalTitle');
        const mBody = document.getElementById('modalBody');

        function openModal(key) {
            if (canvasData[key]) {
                mTitle.innerText = canvasData[key].title;
                mBody.innerHTML = canvasData[key].content;
                overlay.style.display = 'flex';
            }
        }

    function closeModal() {
    overlay.style.display = 'none';
    }
        function closeOnOutside(event) {
            if (event.target === overlay) {
                closeModal();
                }
}
