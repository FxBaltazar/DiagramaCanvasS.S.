<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama Canvas - Solar System</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-canvas: #ffffff;
            --border-color: #cbd5e1;
            --text-dark: #1e293b;
            --text-light: #ffffff;
            --accent: #2563eb;
            --accent-bg: #eff6ff;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.2rem;
            margin: 0;
            color: #38bdf8;
        }

        header h2 {
            font-size: 1.4rem;
            font-weight: 400;
            margin: 5px 0 0 0;
            color: #94a3b8;
        }

        /* Rejilla del Lean Canvas según tu imagen */
        .canvas-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-auto-rows: minmax(110px, auto);
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            background: var(--bg-canvas);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Estilo base para cada recuadro */
        .box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            color: var(--text-dark);
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .box:hover {
            background: var(--accent-bg);
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .double-row {
            grid-row: span 2;
        }

        .propuesta-box {
            grid-row: span 2;
            border: 2px solid var(--accent);
            background: var(--accent-bg);
        }

        .wide-3 {
            grid-column: span 3;
        }

        .wide-2 {
            grid-column: span 2;
        }

        /* 📋 CUADRO DE TEXTO FIJO PARA MOSTRAR LA INFORMACIÓN */
        .info-panel {
            display: none; /* Se mantiene oculto hasta que se hace clic */
            width: 100%;
            max-width: 1200px;
            background: #ffffff;
            color: var(--text-dark);
            border: 3px solid var(--accent);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            position: relative;
            box-sizing: border-box;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-panel h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.3rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .info-panel ul {
            padding-left: 20px;
            line-height: 1.6;
            margin: 0;
        }

        .info-panel li {
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        /* Botón X de Cierre */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 26px;
            font-weight: bold;
            color: #94a3b8;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #ef4444;
        }

        @media (max-width: 900px) {
            .canvas-grid { display: flex; flex-direction: column; }
            .box { min-height: 90px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Diagrama Canvas</h1>
        <h2>(Solar System)</h2>
    </header>

    <!-- Estructura del Canvas -->
    <div class="canvas-grid">
        <!-- Fila 1 -->
        <div class="box" onclick="showInfo('problemas')">1. Problemas</div>
        <div class="box" onclick="showInfo('alternativas')">1b. Alternativas</div>
        <div class="box propuesta-box" onclick="showInfo('propuesta')">3. Propuesta de Valor</div>
        <div class="box" onclick="showInfo('solucion')">4. Solución</div>
        <div class="box" onclick="showInfo('metricas')">8. Métricas</div>

        <!-- Fila 2 -->
        <div class="box" onclick="showInfo('ventajas')">9. Ventajas Competitivas</div>
        <div class="box" onclick="showInfo('canales')">5. Canales</div>
        <div class="box double-row" onclick="showInfo('segmento')">2. Segmento de Clientes</div>

        <!-- Fila 3 e Inferior -->
        <div class="box wide-2" onclick="showInfo('costos')">7. Estructura de Costos</div>
        <div class="box wide-3" style="grid-column: 1 / 4;" onclick="showInfo('ingresos')">6. Flujo de Ingresos</div>
    </div>

    <!-- 🎯 RECUADRO DE TEXTO DONDE APARECERÁ LA INFORMACIÓN -->
    <div id="infoPanel" class="info-panel">
        <button class="close-btn" onclick="hideInfo()">&times;</button>
        <h3 id="panelTitle">Título del Bloque</h3>
        <div id="panelBody">Aquí saldrán los puntos anotados...</div>
    </div>

    <script>
        // Base de datos de texto plano y entendible
        const canvasData = {
            problemas: {
                title: "1. Problemas",
                content: "<ul><li>Precios muy altos en las tiendas de La Paz debido a que el producto pasa por muchos revendedores.</li><li>Poco stock de piezas modernas: Las tiendas locales suelen tardar meses en traer lo último del mercado.</li><li>Malas garantías: Muchas tiendas informales no quieren hacerse cargo de fallas o tardan demasiado.</li></ul>"
            },
            alternativas: {
                title: "1b. Alternativas",
                content: "<ul><li>Comprar en las tiendas tradicionales de la Eloy Salmón o centros comerciales tecnológicos.</li><li>Pedir el producto por internet a páginas de afuera (asumiendo largas esperas y riesgos de pérdida).</li></ul>"
            },
            solucion: {
                title: "4. Solución",
                content: "<ul><li>Importación directa: Comprar directamente a distribuidores grandes del exterior para vender más barato en La Paz.</li><li>Pedidos personalizados: Si un cliente busca una pieza muy específica que no hay en el país, se la traemos por encargo.</li></ul>"
            },
            metricas: {
                title: "8. Métricas",
                content: "<ul><li>Número de clientes nuevos que nos compran cada mes.</li><li>Cantidad de personas que nos recomiendan con sus conocidos tras su compra.</li></ul>"
            },
            propuesta: {
                title: "3. Propuesta de Valor",
                content: "<p><strong>'Traemos la mejor tecnología para tu computadora directo del extranjero, al precio más justo de La Paz y con garantía real'.</strong></p>"
            },
            ventajas: {
                title: "9. Ventajas Competitivas",
                content: "<ul><li>Rapidez y confianza: Traemos los productos en tiempo récord y ofrecemos un servicio técnico propio que soluciona cualquier falla de fábrica de inmediato, sin intermediarios.</li></ul>"
            },
            canales: {
                title: "5. Canales",
                content: "<ul><li>Venta por redes sociales (videos demostrativos en TikTok y Facebook Marketplace).</li><li>Atención y catálogo rápido a través de WhatsApp.</li><li>Entregas en puntos céntricos y seguros de la ciudad (o envíos a domicilio).</li></ul>"
            },
            segmento: {
                title: "2. Segmento de Clientes",
                content: "<ul><li>Jóvenes gamers que quieren armar o mejorar sus computadoras para jugar.</li><li>Diseñadores, editores de video y programadores que necesitan equipos potentes para trabajar rápido.</li></ul>"
            },
            costos: {
                title: "7. Estructura de Costos",
                content: "<ul><li>Dinero para comprar la mercadería afuera y pagar el transporte internacional.</li><li>Pago de los impuestos obligatorios en la Aduana de Bolivia.</li><li>Gastos en publicidad por internet para que más gente en La Paz conozca el negocio.</li></ul>"
            },
            ingresos: {
                title: "6. Flujo de Ingresos",
                content: "<ul><li>Ganancia por la venta de las piezas de hardware (tarjetas de video, procesadores, memorias, etc.).</li><li>Cobro por el servicio de armado, limpieza y optimización de las computadoras.</li></ul>"
            }
        };

        const panel = document.getElementById('infoPanel');
        const pTitle = document.getElementById('panelTitle');
        const pBody = document.getElementById('panelBody');

        // Función que lee los clics y despliega la caja de texto
        function showInfo(key) {
            if (canvasData[key]) {
                pTitle.innerText = canvasData[key].title;
                pBody.innerHTML = canvasData[key].content;
                panel.style.display = 'block'; // Hace visible el recuadro de texto plano
                
                // Desplazar suavemente la pantalla hacia el recuadro de texto
panel.scrollIntoView({ behavior: 'smooth' });
                }
            }
        function hideInfo() {
            panel.style.display = 'none';
              }
