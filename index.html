<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diagrama Canvas - Solar System</title>

    <style>

        /* =====================================================
           VARIABLES SOLARES
        ===================================================== */

        :root {
            --space-1: #020617;
            --space-2: #0b1120;
            --space-3: #111827;

            --star: #ffffff;

            --blue: #38bdf8;
            --cyan: #22d3ee;
            --violet: #a78bfa;
            --purple: #8b5cf6;
            --gold: #fbbf24;
            --orange: #fb923c;

            --text: #e2e8f0;
            --text-dark: #172033;

            --panel: rgba(15, 23, 42, 0.88);

            --border: rgba(148, 163, 184, 0.35);
        }


        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            min-height: 100%;
        }


        body {

            font-family:
                'Segoe UI',
                system-ui,
                sans-serif;

            margin: 0;

            padding: 20px;

            min-height: 100vh;

            color: var(--text);

            display: flex;

            flex-direction: column;

            align-items: center;

            overflow-x: hidden;


            /* ESPACIO PROFUNDO */

            background:

                radial-gradient(
                    circle at 20% 20%,
                    rgba(56, 189, 248, 0.12),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 80% 30%,
                    rgba(139, 92, 246, 0.14),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 50% 90%,
                    rgba(34, 211, 238, 0.08),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    var(--space-1),
                    var(--space-2),
                    var(--space-3)
                );

            position: relative;
        }


        /* =====================================================
           ESTRELLAS
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: 0.65;

            background-image:

                radial-gradient(
                    1px 1px at 10% 20%,
                    white,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 25% 70%,
                    white,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 42% 30%,
                    white,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 63% 15%,
                    white,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 78% 65%,
                    white,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 91% 35%,
                    white,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 54% 82%,
                    white,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 15% 90%,
                    white,
                    transparent
                );

            z-index: 0;
        }


        /* =====================================================
           ENCABEZADO
        ===================================================== */

        header {

            text-align: center;

            margin-bottom: 25px;

            position: relative;

            z-index: 2;
        }


        header h1 {

            margin: 0;

            font-size: 2.35rem;

            letter-spacing: 2px;

            color: var(--blue);

            text-shadow:

                0 0 8px rgba(56, 189, 248, 0.7),

                0 0 25px rgba(56, 189, 248, 0.3);
        }


        header h2 {

            margin: 6px 0 0;

            font-size: 1.1rem;

            font-weight: 400;

            letter-spacing: 4px;

            color: #94a3b8;
        }


        /* pequeño indicador */

        header::after {

            content: "✦  SOLAR SYSTEM BUSINESS MODEL  ✦";

            display: block;

            margin-top: 12px;

            font-size: 0.7rem;

            letter-spacing: 3px;

            color: var(--violet);

            opacity: 0.8;
        }


        /* =====================================================
           CANVAS
        ===================================================== */

        .canvas-grid {

            position: relative;

            z-index: 2;

            display: grid;

            grid-template-columns:
                repeat(10, 1fr);

            grid-template-rows:
                150px
                150px
                130px;

            grid-template-areas:

                "prob prob sol sol prop prop vent vent seg seg"

                "alt alt met met prop prop can can seg seg"

                "cost cost cost cost cost ingr ingr ingr ingr ingr";

            width: 100%;

            max-width: 1250px;

            overflow: hidden;

            border-radius: 16px;


            /* PANEL ESPACIAL */

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.97),
                    rgba(241,245,249,0.97)
                );


            border:

                1px solid
                rgba(125, 211, 252, 0.45);


            box-shadow:

                0 0 0 1px rgba(139, 92, 246, 0.15),

                0 0 35px rgba(56, 189, 248, 0.15),

                0 20px 60px rgba(0, 0, 0, 0.6);
        }


        /* =====================================================
           POSICIONES
        ===================================================== */

        .b-prob {
            grid-area: prob;
        }

        .b-sol {
            grid-area: sol;
        }

        .b-prop {
            grid-area: prop;
        }

        .b-vent {
            grid-area: vent;
        }

        .b-seg {
            grid-area: seg;
        }

        .b-alt {
            grid-area: alt;
        }

        .b-met {
            grid-area: met;
        }

        .b-can {
            grid-area: can;
        }

        .b-cost {
            grid-area: cost;
        }

        .b-ingr {
            grid-area: ingr;
        }


        /* =====================================================
           RECUADROS
        ===================================================== */

        .box {

            position: relative;

            border:

                1px solid
                rgba(100, 116, 139, 0.35);

            color: var(--text-dark);

            cursor: pointer;

            font-weight: 700;

            font-size: 1rem;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 15px;

            background:

                linear-gradient(
                    145deg,
                    rgba(248,250,252,0.98),
                    rgba(226,232,240,0.94)
                );

            transition:

                transform 0.25s ease,

                background 0.25s ease,

                border-color 0.25s ease,

                box-shadow 0.25s ease;

            overflow: hidden;
        }


        /* línea luminosa */

        .box::before {

            content: "";

            position: absolute;

            left: 0;

            top: 0;

            width: 4px;

            height: 100%;

            background:

                linear-gradient(
                    to bottom,
                    var(--blue),
                    var(--violet)
                );

            opacity: 0.65;

            transition: 0.25s;
        }


        /* brillo interior */

        .box::after {

            content: "";

            position: absolute;

            width: 100px;

            height: 100px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(56,189,248,0.16),
                    transparent 70%
                );

            top: -55px;

            right: -40px;

            pointer-events: none;
        }


        /* =====================================================
           HOVER
        ===================================================== */

        .box:hover {

            transform: scale(1.025);

            background:

                linear-gradient(
                    145deg,
                    #ffffff,
                    #eef6ff
                );

            border-color: var(--blue);

            box-shadow:

                inset 0 0 20px
                rgba(56,189,248,0.08),

                0 0 18px
                rgba(56,189,248,0.25);

            z-index: 5;
        }


        .box:hover::before {

            width: 7px;

            opacity: 1;

            box-shadow:

                0 0 12px var(--blue);
        }


        /* =====================================================
           COLORES INDIVIDUALES
        ===================================================== */


        /* PROBLEMAS */

        .b-prob::before {

            background:
                linear-gradient(
                    to bottom,
                    #ef4444,
                    #f97316
                );
        }


        /* SOLUCIÓN */

        .b-sol::before {

            background:
                linear-gradient(
                    to bottom,
                    var(--blue),
                    var(--cyan)
                );
        }


        /* PROPUESTA DE VALOR */

        .b-prop {

            background:

                linear-gradient(
                    145deg,
                    #eff6ff,
                    #eef2ff
                );

            border:

                2px solid
                rgba(99,102,241,0.55);

            box-shadow:

                inset 0 0 25px
                rgba(99,102,241,0.08),

                0 0 20px
                rgba(99,102,241,0.12);
        }


        .b-prop::before {

            width: 6px;

            background:

                linear-gradient(
                    to bottom,
                    var(--gold),
                    var(--orange),
                    var(--purple)
                );
        }


        .b-prop:hover {

            border-color: var(--violet);

            box-shadow:

                inset 0 0 30px
                rgba(139,92,246,0.12),

                0 0 25px
                rgba(139,92,246,0.28);
        }


        /* VENTAJAS */

        .b-vent::before {

            background:

                linear-gradient(
                    to bottom,
                    var(--gold),
                    #f59e0b
                );
        }


        /* SEGMENTO */

        .b-seg {

            background:

                linear-gradient(
                    145deg,
                    #f8fafc,
                    #e0f2fe
                );
        }

        .b-seg::before {

            background:

                linear-gradient(
                    to bottom,
                    var(--cyan),
                    var(--blue)
                );
        }


        /* ALTERNATIVAS */

        .b-alt::before {

            background:

                linear-gradient(
                    to bottom,
                    #8b5cf6,
                    #c084fc
                );
        }


        /* MÉTRICAS */

        .b-met::before {

            background:

                linear-gradient(
                    to bottom,
                    #14b8a6,
                    #22d3ee
                );
        }


        /* CANALES */

        .b-can::before {

            background:

                linear-gradient(
                    to bottom,
                    #6366f1,
                    #a78bfa
                );
        }


        /* COSTOS */

        .b-cost {

            background:

                linear-gradient(
                    145deg,
                    #f8fafc,
                    #e2e8f0
                );
        }

        .b-cost::before {

            background:

                linear-gradient(
                    to bottom,
                    #64748b,
                    #475569
                );
        }


        /* INGRESOS */

        .b-ingr {

            background:

                linear-gradient(
                    145deg,
                    #fffbeb,
                    #fef3c7
                );
        }

        .b-ingr::before {

            background:

                linear-gradient(
                    to bottom,
                    #f59e0b,
                    #fbbf24
                );
        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:

                radial-gradient(
                    circle at center,
                    rgba(56,189,248,0.08),
                    transparent 35%
                ),

                rgba(2,6,23,0.82);

            backdrop-filter: blur(7px);

            justify-content: center;

            align-items: center;

            padding: 20px;

            z-index: 99999;
        }


        /* =====================================================
           PANEL CENTRAL
        ===================================================== */

        .info-panel {

            position: relative;

            width: 90%;

            max-width: 570px;

            max-height: 80vh;

            overflow-y: auto;

            padding: 32px;

            color: #dbeafe;


            background:

                linear-gradient(
                    145deg,
                    rgba(15,23,42,0.97),
                    rgba(17,24,39,0.97)
                );


            border:

                1px solid
                rgba(56,189,248,0.65);


            border-radius: 16px;


            box-shadow:

                0 0 0 1px
                rgba(139,92,246,0.15),

                0 0 30px
                rgba(56,189,248,0.2),

                0 30px 80px
                rgba(0,0,0,0.7);


            animation:

                aparecer 0.25s ease;
        }


        /* borde luminoso */

        .info-panel::before {

            content: "";

            position: absolute;

            top: 0;

            left: 12%;

            width: 76%;

            height: 2px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    var(--cyan),
                    var(--violet),
                    transparent
                );

            box-shadow:

                0 0 15px
                var(--cyan);
        }


        /* =====================================================
           ANIMACIÓN
        ===================================================== */

        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    scale(0.9)
                    translateY(15px);

            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

            }
        }


        /* =====================================================
           TÍTULO DEL MODAL
        ===================================================== */

        .info-panel h3 {

            margin-top: 0;

            margin-bottom: 20px;

            padding-bottom: 12px;

            padding-right: 40px;

            font-size: 1.45rem;

            color: var(--cyan);

            letter-spacing: 0.5px;

            border-bottom:

                1px solid
                rgba(148,163,184,0.25);

            text-shadow:

                0 0 10px
                rgba(34,211,238,0.35);
        }


        /* =====================================================
           TEXTO MODAL
        ===================================================== */

        .info-panel p {

            font-size: 1.05rem;

            line-height: 1.7;

            margin: 0;

            color: #dbeafe;
        }


        .info-panel ul {

            margin: 0;

            padding-left: 22px;

            line-height: 1.7;
        }


        .info-panel li {

            margin-bottom: 12px;

            font-size: 1.02rem;

            color: #dbeafe;
        }


        .info-panel strong {

            color: var(--gold);
        }


        /* =====================================================
           BOTÓN CERRAR
        ===================================================== */

        .close-btn {

            position: absolute;

            top: 12px;

            right: 17px;

            width: 35px;

            height: 35px;

            font-size: 27px;

            font-weight: bold;

            color: #94a3b8;

            cursor: pointer;

            border: none;

            background: transparent;

            border-radius: 50%;

            transition:

                color 0.2s,

                background 0.2s,

                transform 0.2s;
        }


        .close-btn:hover {

            color: #ffffff;

            background:

                rgba(239,68,68,0.2);

            transform: rotate(90deg);
        }


        /* =====================================================
           BARRA DE SCROLL DEL MODAL
        ===================================================== */

        .info-panel::-webkit-scrollbar {

            width: 7px;
        }


        .info-panel::-webkit-scrollbar-track {

            background:
                rgba(15,23,42,0.5);
        }


        .info-panel::-webkit-scrollbar-thumb {

            background:

                linear-gradient(
                    var(--cyan),
                    var(--violet)
                );

            border-radius: 10px;
        }


        /* =====================================================
           RESPONSIVE TABLET
        ===================================================== */

        @media (max-width: 900px) {

            body {
                padding: 15px;
            }


            header h1 {
                font-size: 1.8rem;
            }


            header h2 {
                font-size: 1rem;
                letter-spacing: 2px;
            }


            .canvas-grid {

                grid-template-columns:
                    1fr 1fr;

                grid-template-rows:
                    auto;

                grid-template-areas:

                    "prob sol"

                    "alt met"

                    "prop prop"

                    "vent can"

                    "seg seg"

                    "cost ingr";
            }


            .box {

                min-height: 105px;
            }
        }


        /* =====================================================
           RESPONSIVE CELULAR
        ===================================================== */

        @media (max-width: 550px) {

            body {
                padding: 10px;
            }


            header {
                margin-bottom: 18px;
            }


            header h1 {
                font-size: 1.55rem;
            }


            header h2 {
                font-size: 0.85rem;
            }


            header::after {
                font-size: 0.55rem;
                letter-spacing: 2px;
            }


            .canvas-grid {

                grid-template-columns: 1fr;

                grid-template-areas:

                    "prob"

                    "alt"

                    "sol"

                    "met"

                    "prop"

                    "vent"

                    "can"

                    "seg"

                    "cost"

                    "ingr";
            }


            .box {

                min-height: 90px;

                font-size: 0.95rem;
            }


            .info-panel {

                width: 95%;

                max-height: 85vh;

                padding: 27px 20px;
            }


            .info-panel h3 {

                font-size: 1.2rem;
            }


            .info-panel li,
            .info-panel p {

                font-size: 0.95rem;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         ENCABEZADO
    ===================================================== -->

    <header>

        <h1>Diagrama Canvas</h1>

        <h2>(Solar System)</h2>

    </header>



    <!-- =====================================================
         CANVAS
    ===================================================== -->

    <div class="canvas-grid">


        <div
            class="box b-prob"
            onclick="showInfo('problemas')">

            1. Problemas

        </div>


        <div
            class="box b-sol"
            onclick="showInfo('solucion')">

            4. Solución

        </div>


        <div
            class="box b-prop"
            onclick="showInfo('propuesta')">

            3. Propuesta de Valor

        </div>


        <div
            class="box b-vent"
            onclick="showInfo('ventajas')">

            9. Ventajas Competitivas

        </div>


        <div
            class="box b-seg"
            onclick="showInfo('segmento')">

            2. Segmento de Clientes

        </div>


        <div
            class="box b-alt"
            onclick="showInfo('alternativas')">

            1b. Alternativas

        </div>


        <div
            class="box b-met"
            onclick="showInfo('metricas')">

            8. Métricas

        </div>


        <div
            class="box b-can"
            onclick="showInfo('canales')">

            5. Canales

        </div>


        <div
            class="box b-cost"
            onclick="showInfo('costos')">

            7. Estructura de Costos

        </div>


        <div
            class="box b-ingr"
            onclick="showInfo('ingresos')">

            6. Flujo de Ingresos

        </div>


    </div>



    <!-- =====================================================
         MODAL
    ===================================================== -->

    <div
        id="modalOverlay"
        class="modal-overlay"
        onclick="closeOnOutside(event)">


        <div class="info-panel">


            <button
                class="close-btn"
                onclick="hideInfo()"
                aria-label="Cerrar">

                &times;

            </button>


            <h3 id="panelTitle">

                Título

            </h3>


            <div id="panelBody">

                Contenido

            </div>


        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>


        const canvasData = {


            problemas: {

                title: "Problemas",

                content: `
                    <ul>

                        <li>
                            Precios muy altos en las tiendas de La Paz debido a la inestabilidad del dolar.
                        </li>

                        <li>
                            Poco stock de piezas modernas: Las tiendas locales suelen tardar meses en traer lo último del mercado.
                        </li>

                        <li>
                            Malas garantías: Muchas tiendas informales no quieren hacerse cargo de fallas o tardan demasiado.
                        </li>

                    </ul>
                `
            },


            alternativas: {

                title: "Alternativas",

                content: `
                    <ul>

                        <li>
                            Comprar en las tiendas tradicionales de la Eloy Salmón , Calatayud o centros comerciales tecnológicos.
                        </li>

                        <li>
                            Pedir el producto por internet a páginas de afuera (asumiendo largas esperas y riesgos de pérdida).
                        </li>

                    </ul>
                `
            },


            propuesta: {

                title: "Propuesta de Valor",

                content: `
                    <p>

                        <strong>
                            "Traemos la mejor tecnología para tu computadora directo del extranjero, al precio más justo de La Paz y con garantía real".
                        </strong>

                    </p>
                `
            },


            solucion: {

                title: "Solución",

                content: `
                    <ul>

                        <li>
                            Importación directa: Comprar directamente a distribuidores grandes del exterior para vender más barato en La Paz.
                        </li>

                        <li>
                            Pedidos personalizados: Si un cliente busca una pieza muy específica que no hay en el país, se la traemos por encargo.
                        </li>

                    </ul>
                `
            },


            canales: {

                title: "Canales",

                content: `
                    <ul>

                        <li>
                            Venta por redes sociales (videos demostrativos en TikTok y Facebook Marketplace).
                        </li>

                        <li>
                            Atención y catálogo rápido a través de WhatsApp.
                        </li>

                        <li>
                            Entregas en puntos céntricos y seguros de la ciudad (o envíos a domicilio).
                        </li>

                    </ul>
                `
            },


            ingresos: {

                title: "Flujo de Ingresos",

                content: `
                    <ul>

                        <li>
                            Ganancia por la venta de las piezas de hardware (tarjetas de video, procesadores, memorias, etc.).
                        </li>

                        <li>
                            Cobro por el servicio de armado, limpieza y optimización de las computadoras.
                        </li>

                    </ul>
                `
            },


            costos: {

                title: "Estructura de Costos",

                content: `
                    <ul>

                        <li>
                            Dinero para comprar la mercadería afuera y pagar el transporte internacional.
                        </li>

                        <li>
                            Pago de los impuestos obligatorios en la Aduana de Bolivia.
                        </li>

                        <li>
                            Gastos en publicidad por internet para que más gente en La Paz conozca el negocio.
                        </li>

                    </ul>
                `
            },


            metricas: {

                title: "Métricas",

                content: `
                    <ul>

                        <li>
                            Número de clientes nuevos que nos compran cada mes.
                        </li>

                        <li>
                            Cantidad de personas que nos recomiendan con sus conocidos tras su compra.
                        </li>

                    </ul>
                `
            },


            ventajas: {

                title: "Ventajas Competitivas",

                content: `
                    <ul>

                        <li>
                            Rapidez y confianza: Traemos los productos en tiempo récord y ofrecemos un servicio técnico propio que soluciona cualquier falla de fábrica de inmediato, sin intermediarios.
                        </li>

                    </ul>
                `
            },


            segmento: {

                title: "Segmento de Clientes",

                content: `
                    <ul>

                        <li>
                            Jóvenes gamers que quieren armar o mejorar sus computadoras para jugar.
                        </li>

                        <li>
                            Diseñadores, editores de video y programadores que necesitan equipos potentes para trabajar rápido.
                        </li>

                        <li>
                            Estudiantes Universitarios y Colegiales que requieren de equipos pc, laptops para sus clases modalidad virtual o tareas cotidianas.
                        </li>

                    </ul>
                `
            }

        };


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const overlay =
            document.getElementById("modalOverlay");

        const pTitle =
            document.getElementById("panelTitle");

        const pBody =
            document.getElementById("panelBody");


        /* =====================================================
           MOSTRAR INFORMACIÓN
        ===================================================== */

        function showInfo(key) {

            if (canvasData[key]) {

                pTitle.innerText =
                    canvasData[key].title;

                pBody.innerHTML =
                    canvasData[key].content;

                overlay.style.display = "flex";

                document.body.style.overflow =
                    "hidden";
            }

        }


        /* =====================================================
           CERRAR
        ===================================================== */

        function hideInfo() {

            overlay.style.display = "none";

            document.body.style.overflow =
                "";
        }


        /* =====================================================
           CERRAR AL HACER CLICK AFUERA
        ===================================================== */

        function closeOnOutside(event) {

            if (event.target === overlay) {

                hideInfo();

            }

        }


        /* =====================================================
           CERRAR CON ESC
        ===================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape" &&
                    overlay.style.display === "flex"
                ) {

                    hideInfo();

                }

            }
        );

    </script>

</body>
</html>
