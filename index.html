<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diagrama Canvas - Solar System</title>

    <style>

        /* =====================================================
           PALETA SOLAR
        ===================================================== */

        :root {
            --space-black: #02030a;
            --space-blue: #050b1c;
            --space-purple: #0c0820;

            --blue: #38bdf8;
            --cyan: #22d3ee;
            --violet: #8b5cf6;
            --purple: #a855f7;

            --sun: #facc15;
            --sun-orange: #f97316;

            --mars: #ef4444;
            --earth: #06b6d4;
            --neptune: #3b82f6;
            --venus: #f59e0b;
            --uranus: #2dd4bf;

            --white: #f8fafc;
            --silver: #cbd5e1;
            --dark-text: #e2e8f0;
        }


        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {

            margin: 0;

            padding: 20px;

            min-height: 100vh;

            font-family:
                'Segoe UI',
                system-ui,
                sans-serif;

            color: var(--white);

            display: flex;

            flex-direction: column;

            align-items: center;

            overflow-x: hidden;

            position: relative;


            /* ESPACIO PROFUNDO */

            background:

                radial-gradient(
                    circle at 50% 45%,
                    rgba(91, 33, 182, 0.18),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 15% 15%,
                    rgba(14, 165, 233, 0.16),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(124, 58, 237, 0.14),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 80% 15%,
                    rgba(250, 204, 21, 0.06),
                    transparent 18%
                ),

                linear-gradient(
                    135deg,
                    var(--space-black),
                    var(--space-blue) 50%,
                    var(--space-purple)
                );
        }


        /* =====================================================
           CAMPO DE ESTRELLAS
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 0;

            opacity: 0.85;

            background-image:

                radial-gradient(
                    1px 1px at 4% 12%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 9% 72%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    2px 2px at 17% 37%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 24% 84%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 31% 18%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    2px 2px at 38% 65%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 44% 9%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 52% 27%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    2px 2px at 59% 78%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 66% 13%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 73% 52%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    2px 2px at 81% 22%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 88% 69%,
                    #ffffff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 96% 41%,
                    #ffffff,
                    transparent
                );
        }


        /* =====================================================
           ESTRELLAS DE COLOR
        ===================================================== */

        body::after {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 0;

            opacity: 0.5;

            background-image:

                radial-gradient(
                    2px 2px at 12% 45%,
                    rgba(56,189,248,0.9),
                    transparent
                ),

                radial-gradient(
                    2px 2px at 70% 30%,
                    rgba(167,139,250,0.9),
                    transparent
                ),

                radial-gradient(
                    2px 2px at 90% 88%,
                    rgba(250,204,21,0.8),
                    transparent
                ),

                radial-gradient(
                    1px 1px at 45% 92%,
                    rgba(34,211,238,0.9),
                    transparent
                );
        }


        /* =====================================================
           ENCABEZADO
        ===================================================== */

        header {

            position: relative;

            z-index: 3;

            text-align: center;

            margin-bottom: 27px;

            padding: 5px 25px 0;
        }


        header h1 {

            margin: 0;

            font-size: 2.5rem;

            font-weight: 700;

            letter-spacing: 4px;

            color: #e0f2fe;

            text-shadow:

                0 0 5px rgba(56,189,248,0.8),

                0 0 15px rgba(56,189,248,0.6),

                0 0 35px rgba(56,189,248,0.35);
        }


        header h2 {

            margin: 7px 0 0;

            font-size: 1.1rem;

            font-weight: 400;

            letter-spacing: 6px;

            color: #94a3b8;

            text-transform: uppercase;
        }


        header::after {

            content:
                "✦  SOLAR SYSTEM BUSINESS MODEL  ✦";

            display: block;

            margin-top: 13px;

            color: var(--cyan);

            font-size: 0.68rem;

            letter-spacing: 4px;

            text-shadow:

                0 0 8px
                rgba(34,211,238,0.8);

            opacity: 0.9;
        }


        /* =====================================================
           CANVAS PRINCIPAL
        ===================================================== */

        .canvas-grid {

            position: relative;

            z-index: 2;

            display: grid;

            grid-template-columns:
                repeat(10, 1fr);

            grid-template-rows:
                150px
                150px
                130px;

            grid-template-areas:

                "prob prob sol sol prop prop vent vent seg seg"

                "alt alt met met prop prop can can seg seg"

                "cost cost cost cost cost ingr ingr ingr ingr ingr";


            width: 100%;

            max-width: 1250px;

            overflow: hidden;

            border-radius: 18px;


            /* SUPERFICIE ESPACIAL */

            background:

                linear-gradient(
                    135deg,
                    rgba(7, 14, 32, 0.96),
                    rgba(11, 18, 40, 0.97),
                    rgba(19, 10, 42, 0.96)
                );


            border:

                1px solid
                rgba(56,189,248,0.5);


            box-shadow:

                0 0 0 1px
                rgba(139,92,246,0.18),

                0 0 25px
                rgba(56,189,248,0.18),

                0 0 70px
                rgba(99,102,241,0.12),

                0 25px 70px
                rgba(0,0,0,0.8);

            isolation: isolate;
        }


        /* =====================================================
           ÓRBITAS DECORATIVAS DEL CANVAS
        ===================================================== */

        .canvas-grid::before {

            content: "";

            position: absolute;

            width: 560px;

            height: 560px;

            border:

                1px solid
                rgba(56,189,248,0.07);

            border-radius: 50%;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%)
                rotate(-15deg);

            box-shadow:

                0 0 0 45px
                rgba(139,92,246,0.025),

                0 0 0 95px
                rgba(56,189,248,0.018),

                0 0 0 145px
                rgba(250,204,21,0.012);

            pointer-events: none;

            z-index: -1;
        }


        .canvas-grid::after {

            content: "";

            position: absolute;

            width: 380px;

            height: 150px;

            border:

                1px solid
                rgba(167,139,250,0.08);

            border-radius: 50%;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%)
                rotate(18deg);

            pointer-events: none;

            z-index: -1;
        }


        /* =====================================================
           POSICIONES
        ===================================================== */

        .b-prob {
            grid-area: prob;
        }

        .b-sol {
            grid-area: sol;
        }

        .b-prop {
            grid-area: prop;
        }

        .b-vent {
            grid-area: vent;
        }

        .b-seg {
            grid-area: seg;
        }

        .b-alt {
            grid-area: alt;
        }

        .b-met {
            grid-area: met;
        }

        .b-can {
            grid-area: can;
        }

        .b-cost {
            grid-area: cost;
        }

        .b-ingr {
            grid-area: ingr;
        }


        /* =====================================================
           BLOQUES
        ===================================================== */

        .box {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 18px;

            cursor: pointer;

            overflow: hidden;


            color: #e5eefc;

            font-size: 1rem;

            font-weight: 700;

            letter-spacing: 0.4px;


            background:

                linear-gradient(
                    145deg,
                    rgba(17, 30, 55, 0.9),
                    rgba(9, 18, 38, 0.94)
                );


            border:

                1px solid
                rgba(148,163,184,0.22);


            transition:

                transform 0.28s ease,

                border-color 0.28s ease,

                box-shadow 0.28s ease,

                background 0.28s ease;
        }


        /* Línea lateral luminosa */

        .box::before {

            content: "";

            position: absolute;

            left: 0;

            top: 0;

            width: 4px;

            height: 100%;

            background:

                linear-gradient(
                    to bottom,
                    var(--blue),
                    var(--violet)
                );

            box-shadow:

                0 0 12px
                rgba(56,189,248,0.5);

            opacity: 0.85;

            transition: 0.28s;
        }


        /* Brillo planetario */

        .box::after {

            content: "";

            position: absolute;

            width: 150px;

            height: 150px;

            border-radius: 50%;

            top: -85px;

            right: -65px;

            background:

                radial-gradient(
                    circle,
                    rgba(56,189,248,0.15),
                    transparent 68%
                );

            pointer-events: none;

            transition: 0.3s;
        }


        /* =====================================================
           HOVER GENERAL
        ===================================================== */

        .box:hover {

            transform: scale(1.018);

            border-color:
                rgba(56,189,248,0.75);

            background:

                linear-gradient(
                    145deg,
                    rgba(16,35,67,0.98),
                    rgba(12,24,52,0.98)
                );


            box-shadow:

                inset 0 0 30px
                rgba(56,189,248,0.06),

                0 0 18px
                rgba(56,189,248,0.25),

                0 0 35px
                rgba(56,189,248,0.08);

            z-index: 5;
        }


        .box:hover::before {

            width: 7px;

            opacity: 1;

            box-shadow:

                0 0 18px
                var(--blue);
        }


        .box:hover::after {

            transform: scale(1.3);

            opacity: 1;
        }


        /* =====================================================
           PROBLEMAS
           PLANETA ROJO
        ===================================================== */

        .b-prob {

            background:

                linear-gradient(
                    145deg,
                    rgba(50,12,20,0.78),
                    rgba(20,12,27,0.95)
                );
        }

        .b-prob::before {

            background:

                linear-gradient(
                    to bottom,
                    #ef4444,
                    #f97316
                );

            box-shadow:

                0 0 15px
                rgba(239,68,68,0.7);
        }

        .b-prob::after {

            background:

                radial-gradient(
                    circle,
                    rgba(239,68,68,0.17),
                    transparent 68%
                );
        }

        .b-prob:hover {

            border-color:
                rgba(239,68,68,0.75);

            box-shadow:

                0 0 25px
                rgba(239,68,68,0.2);
        }


        /* =====================================================
           ALTERNATIVAS
           PLANETA VIOLETA
        ===================================================== */

        .b-alt {

            background:

                linear-gradient(
                    145deg,
                    rgba(36,18,66,0.82),
                    rgba(14,13,35,0.96)
                );
        }

        .b-alt::before {

            background:

                linear-gradient(
                    to bottom,
                    #8b5cf6,
                    #c084fc
                );
        }

        .b-alt::after {

            background:

                radial-gradient(
                    circle,
                    rgba(168,85,247,0.18),
                    transparent 68%
                );
        }

        .b-alt:hover {

            border-color:
                rgba(168,85,247,0.75);

            box-shadow:

                0 0 25px
                rgba(168,85,247,0.22);
        }


        /* =====================================================
           SOLUCIÓN
           PLANETA AZUL
        ===================================================== */

        .b-sol {

            background:

                linear-gradient(
                    145deg,
                    rgba(5,38,62,0.86),
                    rgba(7,19,39,0.96)
                );
        }

        .b-sol::before {

            background:

                linear-gradient(
                    to bottom,
                    #38bdf8,
                    #22d3ee
                );
        }

        .b-sol:hover {

            border-color:
                rgba(34,211,238,0.8);

            box-shadow:

                0 0 25px
                rgba(34,211,238,0.22);
        }


        /* =====================================================
           MÉTRICAS
           PLANETA TURQUESA
        ===================================================== */

        .b-met {

            background:

                linear-gradient(
                    145deg,
                    rgba(5,49,53,0.82),
                    rgba(7,23,38,0.96)
                );
        }

        .b-met::before {

            background:

                linear-gradient(
                    to bottom,
                    #14b8a6,
                    #22d3ee
                );
        }

        .b-met:hover {

            border-color:
                rgba(45,212,191,0.8);

            box-shadow:

                0 0 25px
                rgba(45,212,191,0.2);
        }


        /* =====================================================
           PROPUESTA DE VALOR
           EL SOL / NÚCLEO CENTRAL
        ===================================================== */

        .b-prop {

            position: relative;

            background:

                radial-gradient(
                    circle at 50% 50%,
                    rgba(250,204,21,0.13),
                    transparent 48%
                ),

                linear-gradient(
                    145deg,
                    rgba(30,27,55,0.98),
                    rgba(18,17,43,0.98)
                );


            border:

                2px solid
                rgba(139,92,246,0.72);


            box-shadow:

                inset 0 0 35px
                rgba(139,92,246,0.1),

                0 0 20px
                rgba(139,92,246,0.18),

                0 0 45px
                rgba(250,204,21,0.06);
        }


        /* Núcleo solar */

        .b-prop::after {

            width: 210px;

            height: 210px;

            top: 50%;

            left: 50%;

            right: auto;

            transform:
                translate(-50%, -50%);

            background:

                radial-gradient(
                    circle,
                    rgba(250,204,21,0.13) 0%,
                    rgba(249,115,22,0.08) 22%,
                    rgba(139,92,246,0.05) 42%,
                    transparent 70%
                );
        }


        .b-prop::before {

            width: 6px;

            background:

                linear-gradient(
                    to bottom,
                    #fde047,
                    #f97316,
                    #a855f7,
                    #38bdf8
                );

            box-shadow:

                0 0 20px
                rgba(250,204,21,0.75);
        }


        .b-prop:hover {

            transform: scale(1.025);

            border-color:
                rgba(250,204,21,0.9);

            box-shadow:

                inset 0 0 45px
                rgba(139,92,246,0.13),

                0 0 20px
                rgba(250,204,21,0.3),

                0 0 55px
                rgba(139,92,246,0.18);
        }


        /* =====================================================
           VENTAJAS COMPETITIVAS
           DORADO SOLAR
        ===================================================== */

        .b-vent {

            background:

                linear-gradient(
                    145deg,
                    rgba(55,40,9,0.78),
                    rgba(25,20,24,0.96)
                );
        }

        .b-vent::before {

            background:

                linear-gradient(
                    to bottom,
                    #fde047,
                    #f59e0b
                );

            box-shadow:

                0 0 15px
                rgba(250,204,21,0.7);
        }

        .b-vent::after {

            background:

                radial-gradient(
                    circle,
                    rgba(250,204,21,0.17),
                    transparent 68%
                );
        }

        .b-vent:hover {

            border-color:
                rgba(250,204,21,0.8);

            box-shadow:

                0 0 27px
                rgba(250,204,21,0.2);
        }


        /* =====================================================
           CANALES
           NEPTUNO
        ===================================================== */

        .b-can {

            background:

                linear-gradient(
                    145deg,
                    rgba(14,26,64,0.88),
                    rgba(10,14,38,0.97)
                );
        }

        .b-can::before {

            background:

                linear-gradient(
                    to bottom,
                    #6366f1,
                    #38bdf8
                );
        }

        .b-can:hover {

            border-color:
                rgba(99,102,241,0.8);

            box-shadow:

                0 0 25px
                rgba(99,102,241,0.22);
        }


        /* =====================================================
           SEGMENTO DE CLIENTES
           TIERRA
        ===================================================== */

        .b-seg {

            background:

                radial-gradient(
                    circle at 75% 20%,
                    rgba(34,211,238,0.12),
                    transparent 35%
                ),

                linear-gradient(
                    145deg,
                    rgba(8,37,55,0.9),
                    rgba(8,18,39,0.98)
                );
        }

        .b-seg::before {

            background:

                linear-gradient(
                    to bottom,
                    #22d3ee,
                    #38bdf8,
                    #2563eb
                );
        }

        .b-seg:hover {

            border-color:
                rgba(34,211,238,0.8);

            box-shadow:

                0 0 28px
                rgba(34,211,238,0.22);
        }


        /* =====================================================
           ESTRUCTURA DE COSTOS
           ESPACIO / SATURNO
        ===================================================== */

        .b-cost {

            background:

                linear-gradient(
                    145deg,
                    rgba(28,35,48,0.95),
                    rgba(10,17,31,0.98)
                );
        }

        .b-cost::before {

            background:

                linear-gradient(
                    to bottom,
                    #94a3b8,
                    #64748b
                );
        }

        .b-cost:hover {

            border-color:
                rgba(148,163,184,0.75);

            box-shadow:

                0 0 22px
                rgba(148,163,184,0.15);
        }


        /* =====================================================
           FLUJO DE INGRESOS
           SOL DORADO
        ===================================================== */

        .b-ingr {

            background:

                radial-gradient(
                    circle at 80% 30%,
                    rgba(250,204,21,0.12),
                    transparent 35%
                ),

                linear-gradient(
                    145deg,
                    rgba(52,38,8,0.9),
                    rgba(27,20,12,0.98)
                );
        }

        .b-ingr::before {

            background:

                linear-gradient(
                    to bottom,
                    #facc15,
                    #f97316
                );

            box-shadow:

                0 0 16px
                rgba(250,204,21,0.65);
        }

        .b-ingr:hover {

            border-color:
                rgba(250,204,21,0.85);

            box-shadow:

                0 0 28px
                rgba(250,204,21,0.2);
        }


        /* =====================================================
           MODAL / VENTANA CENTRAL
        ===================================================== */

        .modal-overlay {

            display: none;

            position: fixed;

            inset: 0;

            padding: 20px;

            justify-content: center;

            align-items: center;

            z-index: 99999;


            background:

                radial-gradient(
                    circle at center,
                    rgba(56,189,248,0.12),
                    transparent 28%
                ),

                radial-gradient(
                    circle at center,
                    rgba(139,92,246,0.1),
                    transparent 55%
                ),

                rgba(1,4,15,0.86);


            backdrop-filter:
                blur(9px);
        }


        /* =====================================================
           PANEL
        ===================================================== */

        .info-panel {

            position: relative;

            width: 90%;

            max-width: 570px;

            max-height: 80vh;

            overflow-y: auto;

            padding: 34px;

            color: #dbeafe;


            background:

                radial-gradient(
                    circle at 50% 0%,
                    rgba(56,189,248,0.1),
                    transparent 35%
                ),

                linear-gradient(
                    145deg,
                    rgba(7,15,32,0.98),
                    rgba(15,10,38,0.98)
                );


            border:

                1px solid
                rgba(56,189,248,0.7);


            border-radius: 18px;


            box-shadow:

                0 0 0 1px
                rgba(139,92,246,0.18),

                0 0 30px
                rgba(56,189,248,0.22),

                0 0 80px
                rgba(139,92,246,0.13),

                0 30px 90px
                rgba(0,0,0,0.85);


            animation:
                aparecer 0.28s ease;
        }


        /* Anillo del panel */

        .info-panel::before {

            content: "";

            position: absolute;

            top: -1px;

            left: 12%;

            width: 76%;

            height: 2px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #22d3ee,
                    #a78bfa,
                    #facc15,
                    transparent
                );

            box-shadow:

                0 0 18px
                rgba(34,211,238,0.8);
        }


        /* =====================================================
           ANIMACIÓN DEL MODAL
        ===================================================== */

        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    scale(0.88)
                    translateY(20px);

            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

            }
        }


        /* =====================================================
           TÍTULO DEL MODAL
        ===================================================== */

        .info-panel h3 {

            margin-top: 0;

            margin-bottom: 21px;

            padding-bottom: 13px;

            padding-right: 45px;

            font-size: 1.45rem;

            color: #67e8f9;

            letter-spacing: 1px;

            border-bottom:

                1px solid
                rgba(148,163,184,0.25);


            text-shadow:

                0 0 10px
                rgba(34,211,238,0.5);
        }


        /* =====================================================
           TEXTO DEL MODAL
        ===================================================== */

        .info-panel p {

            margin: 0;

            font-size: 1.05rem;

            line-height: 1.75;

            color: #dbeafe;
        }


        .info-panel ul {

            margin: 0;

            padding-left: 23px;

            line-height: 1.75;
        }


        .info-panel li {

            margin-bottom: 13px;

            font-size: 1.02rem;

            color: #dbeafe;
        }


        .info-panel strong {

            color: #fde047;

            text-shadow:

                0 0 8px
                rgba(250,204,21,0.25);
        }


        /* =====================================================
           BOTÓN CERRAR
        ===================================================== */

        .close-btn {

            position: absolute;

            top: 12px;

            right: 15px;

            width: 36px;

            height: 36px;

            padding: 0;

            border: 1px solid
                rgba(148,163,184,0.2);

            border-radius: 50%;

            background:
                rgba(15,23,42,0.7);

            color: #94a3b8;

            font-size: 27px;

            font-weight: bold;

            line-height: 30px;

            cursor: pointer;

            transition:

                color 0.2s,

                background 0.2s,

                border-color 0.2s,

                transform 0.2s;
        }


        .close-btn:hover {

            color: #ffffff;

            background:

                rgba(239,68,68,0.18);

            border-color:

                rgba(239,68,68,0.6);

            transform:
                rotate(90deg);

            box-shadow:

                0 0 15px
                rgba(239,68,68,0.2);
        }


        /* =====================================================
           SCROLL DEL MODAL
        ===================================================== */

        .info-panel::-webkit-scrollbar {

            width: 7px;
        }


        .info-panel::-webkit-scrollbar-track {

            background:
                rgba(2,6,23,0.7);

            border-radius: 10px;
        }


        .info-panel::-webkit-scrollbar-thumb {

            background:

                linear-gradient(
                    var(--cyan),
                    var(--violet)
                );

            border-radius: 10px;

            box-shadow:

                0 0 8px
                rgba(34,211,238,0.4);
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            body {
                padding: 15px;
            }


            header h1 {

                font-size: 1.9rem;

                letter-spacing: 3px;
            }


            header h2 {

                font-size: 0.95rem;

                letter-spacing: 4px;
            }


            .canvas-grid {

                grid-template-columns:
                    1fr 1fr;

                grid-template-rows:
                    auto;

                grid-template-areas:

                    "prob sol"

                    "alt met"

                    "prop prop"

                    "vent can"

                    "seg seg"

                    "cost ingr";
            }


            .box {

                min-height: 105px;

                font-size: 0.95rem;
            }
        }


        /* =====================================================
           CELULAR
        ===================================================== */

        @media (max-width: 550px) {

            body {

                padding: 10px;
            }


            header {

                margin-bottom: 18px;
            }


            header h1 {

                font-size: 1.5rem;

                letter-spacing: 2px;
            }


            header h2 {

                font-size: 0.8rem;

                letter-spacing: 3px;
            }


            header::after {

                font-size: 0.5rem;

                letter-spacing: 2px;
            }


            .canvas-grid {

                grid-template-columns: 1fr;

                grid-template-areas:

                    "prob"

                    "alt"

                    "sol"

                    "met"

                    "prop"

                    "vent"

                    "can"

                    "seg"

                    "cost"

                    "ingr";
            }


            .box {

                min-height: 90px;

                font-size: 0.93rem;
            }


            .info-panel {

                width: 95%;

                max-height: 85vh;

                padding: 28px 20px;
            }


            .info-panel h3 {

                font-size: 1.2rem;
            }


            .info-panel li,
            .info-panel p {

                font-size: 0.95rem;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         ENCABEZADO
    ===================================================== -->

    <header>

        <h1>Diagrama Canvas</h1>

        <h2>(Solar System)</h2>

    </header>



    <!-- =====================================================
         CANVAS
    ===================================================== -->

    <div class="canvas-grid">


        <div
            class="box b-prob"
            onclick="showInfo('problemas')">

            Problemas

        </div>


        <div
            class="box b-sol"
            onclick="showInfo('solucion')">

            Solución

        </div>


        <div
            class="box b-prop"
            onclick="showInfo('propuesta')">

            Propuesta de Valor

        </div>


        <div
            class="box b-vent"
            onclick="showInfo('ventajas')">

            Ventajas Competitivas

        </div>


        <div
            class="box b-seg"
            onclick="showInfo('segmento')">

            Segmento de Clientes

        </div>


        <div
            class="box b-alt"
            onclick="showInfo('alternativas')">

            Alternativas

        </div>


        <div
            class="box b-met"
            onclick="showInfo('metricas')">

            Métricas

        </div>


        <div
            class="box b-can"
            onclick="showInfo('canales')">

            Canales

        </div>


        <div
            class="box b-cost"
            onclick="showInfo('costos')">

            Estructura de Costos

        </div>


        <div
            class="box b-ingr"
            onclick="showInfo('ingresos')">

            Flujo de Ingresos

        </div>


    </div>



    <!-- =====================================================
         MODAL
    ===================================================== -->

    <div
        id="modalOverlay"
        class="modal-overlay"
        onclick="closeOnOutside(event)">


        <div class="info-panel">


            <button
                class="close-btn"
                onclick="hideInfo()"
                aria-label="Cerrar">

                &times;

            </button>


            <h3 id="panelTitle">

                Título

            </h3>


            <div id="panelBody">

                Contenido

            </div>


        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
         SE MANTIENE LA MISMA LÓGICA
    ===================================================== -->

    <script>


        const canvasData = {


            problemas: {

                title: "Problemas",

                content: `

                    <ul>

                        <li>
                            Precios muy altos en las tiendas de La Paz debido a la inestabilidad del dolar.
                        </li>

                        <li>
                            Poco stock de piezas modernas: Las tiendas locales suelen tardar meses en traer lo último del mercado.
                        </li>

                        <li>
                            Malas garantías: Muchas tiendas informales no quieren hacerse cargo de fallas o tardan demasiado.
                        </li>

                    </ul>

                `
            },


            alternativas: {

                title: "Alternativas",

                content: `

                    <ul>

                        <li>
                            Comprar en las tiendas tradicionales de la Eloy Salmón , Calatayud o centros comerciales tecnológicos.
                        </li>

                        <li>
                            Pedir el producto por internet a páginas de afuera (asumiendo largas esperas y riesgos de pérdida).
                        </li>

                    </ul>

                `
            },


            propuesta: {

                title: "Propuesta de Valor",

                content: `

                    <p>

                        <strong>
                            "Traemos la mejor tecnología para tu computadora directo del extranjero, al precio más justo de La Paz y con garantía real".
                        </strong>

                    </p>

                `
            },


            solucion: {

                title: "Solución",

                content: `

                    <ul>

                        <li>
                            Importación directa: Comprar directamente a distribuidores grandes del exterior para vender más barato en La Paz.
                        </li>

                        <li>
                            Pedidos personalizados: Si un cliente busca una pieza muy específica que no hay en el país, se la traemos por encargo.
                        </li>

                    </ul>

                `
            },


            canales: {

                title: "Canales",

                content: `

                    <ul>

                        <li>
                            Venta por redes sociales (videos demostrativos en TikTok y Facebook Marketplace).
                        </li>

                        <li>
                            Atención y catálogo rápido a través de WhatsApp.
                        </li>

                        <li>
                            Entregas en puntos céntricos y seguros de la ciudad (o envíos a domicilio).
                        </li>

                    </ul>

                `
            },


            ingresos: {

                title: "Flujo de Ingresos",

                content: `

                    <ul>

                        <li>
                            Ganancia por la venta de las piezas de hardware (tarjetas de video, procesadores, memorias, etc.).
                        </li>

                        <li>
                            Cobro por el servicio de armado, limpieza y optimización de las computadoras.
                        </li>

                    </ul>

                `
            },


            costos: {

                title: "Estructura de Costos",

                content: `

                    <ul>

                        <li>
                            Dinero para comprar la mercadería afuera y pagar el transporte internacional.
                        </li>

                        <li>
                            Pago de los impuestos obligatorios en la Aduana de Bolivia.
                        </li>

                        <li>
                            Gastos en publicidad por internet para que más gente en La Paz conozca el negocio.
                        </li>

                    </ul>

                `
            },


            metricas: {

                title: "Métricas",

                content: `

                    <ul>

                        <li>
                            Número de clientes nuevos que nos compran cada mes.
                        </li>

                        <li>
                            Cantidad de personas que nos recomiendan con sus conocidos tras su compra.
                        </li>

                    </ul>

                `
            },


            ventajas: {

                title: "Ventajas Competitivas",

                content: `

                    <ul>

                        <li>
                            Rapidez y confianza: Traemos los productos en tiempo récord y ofrecemos un servicio técnico propio que soluciona cualquier falla de fábrica de inmediato, sin intermediarios.
                        </li>

                    </ul>

                `
            },


            segmento: {

                title: "Segmento de Clientes",

                content: `

                    <ul>

                        <li>
                            Jóvenes gamers que quieren armar o mejorar sus computadoras para jugar.
                        </li>

                        <li>
                            Diseñadores, editores de video y programadores que necesitan equipos potentes para trabajar rápido.
                        </li>

                        <li>
                            Estudiantes Universitarios y Colegiales que requieren de equipos pc, laptops para sus clases modalidad virtual o tareas cotidianas.
                        </li>

                    </ul>

                `
            }

        };


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const overlay =
            document.getElementById("modalOverlay");


        const pTitle =
            document.getElementById("panelTitle");


        const pBody =
            document.getElementById("panelBody");



        /* =====================================================
           MOSTRAR INFORMACIÓN
        ===================================================== */

        function showInfo(key) {

            if (canvasData[key]) {

                pTitle.innerText =
                    canvasData[key].title;

                pBody.innerHTML =
                    canvasData[key].content;

                overlay.style.display =
                    "flex";

                document.body.style.overflow =
                    "hidden";
            }

        }



        /* =====================================================
           CERRAR
        ===================================================== */

        function hideInfo() {

            overlay.style.display =
                "none";

            document.body.style.overflow =
                "";
        }



        /* =====================================================
           CERRAR AL HACER CLICK AFUERA
        ===================================================== */

        function closeOnOutside(event) {

            if (
                event.target === overlay
            ) {

                hideInfo();

            }

        }



        /* =====================================================
           CERRAR CON ESC
        ===================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape" &&
                    overlay.style.display === "flex"
                ) {

                    hideInfo();

                }

            }
        );

    </script>

</body>
</html>
